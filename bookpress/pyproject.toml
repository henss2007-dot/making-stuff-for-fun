[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookpress"
version = "0.1.0"
description = "Turn plain text and pictures into a PDF that looks like a real printed book"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
hyphenation = ["pyphen>=0.14"]
test = ["pytest", "pypdf"]

[project.scripts]
bookpress = "bookpress.__main__:main"

[tool.setuptools]
packages = ["bookpress"]

[tool.setuptools.package-data]
bookpress = ["ui.html"]
