[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordmine"
version = "0.1.0"
description = "Mine vocabulary from games, manga and books on your screen into Anki"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "requests>=2.31",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
]

[project.optional-dependencies]
manga = ["manga-ocr"]
chinese = ["jieba"]
ai = ["anthropic"]
pdf = ["pymupdf"]

[project.scripts]
wordmine = "wordmine.__main__:main"

[tool.setuptools]
packages = ["wordmine"]
